# ============================================================
# Nginx 配置 - 智慧场馆数字孪生平台
# 功能：前端静态文件服务 + API反向代理 + WebSocket代理 + Gzip压缩
# ============================================================

# 工作进程数（自动检测CPU核心数）
worker_processes auto;

events {
    # 单个worker最大连接数
    worker_connections 1024;
}

http {
    # MIME类型
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 高效文件传输
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # 保持连接超时
    keepalive_timeout 65;

    # ============================================================
    # Gzip 压缩配置
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # 上游后端服务（Docker Compose中后端服务名）
    upstream backend_api {
        server backend:8000;
    }

    # ============================================================
    # 主服务器配置
    # ============================================================
    server {
        listen 80;
        server_name localhost;

        # 前端静态文件根目录
        root /usr/share/nginx/html;
        index index.html;

        # 安全头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ============================================================
        # API 反向代理 - 将 /api 请求转发到后端 FastAPI
        # ============================================================
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================================
        # WebSocket 代理 - 将 /ws 请求转发到后端
        # ============================================================
        location /ws {
            proxy_pass http://backend_api/ws;
            proxy_http_version 1.1;

            # WebSocket 必需的升级头部
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时设置（保持长连接）
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ============================================================
        # 健康检查端点代理
        # ============================================================
        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
        }

        # ============================================================
        # API 文档代理
        # ============================================================
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_set_header Host $host;
        }

        # ============================================================
        # 前端静态文件 - Vue SPA 路由支持
        # ============================================================
        location / {
            try_files $uri $uri/ /index.html;

            # 静态资源缓存（JS/CSS/图片等带hash的文件）
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }

            # HTML文件不缓存（确保更新及时）
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
}
